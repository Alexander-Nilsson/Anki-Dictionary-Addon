<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" id="wp-block-library-css" href="guide.css" type="text/css" media="all">
	<style>
		/* Local fallbacks — the settings window may inject the dictionary
		   theme's CSS variables; when absent, these defaults keep the guide
		   readable (previously hardcoded black on white). */
		:root {
			--text: #111;
			--header_text: #111;
			--background: #fff;
			--border: #ccc;
			--search_term: #1a5fb4;
		}
		.elementor-widget-container {
		  margin: auto;
		  padding: 0px;
		  width: 800px;
		  max-width: 800px !important;	
		}
		p{	
			margin: 0px;
            margin-top: 20px;
			padding: 0px;
			width: 100%;
			max-width: 800px !important;	
		}
		img {
			display: block;
		    max-width: 800px !important;
		    height:auto !important;
			margin: auto;

		}
		body{
			font-size: 21px !important;
			zoom:110%;
			margin: 0px;
			color: var(--text) !important;
		}
		.table-of-contents-header{
			font-size: 150%;
            font-weight: 600;
            color: var(--header_text);
		}
        .box{
            margin-top:15px;
        }
        h1{
           font-size: 140%; 
           margin-top: 20px;
        }
        h2, h3{
           font-size: 120%; 
           margin-top: 15px;
        }

        a{
        	color: var(--search_term);
        }


	</style>
</head>
</head>
</html>
