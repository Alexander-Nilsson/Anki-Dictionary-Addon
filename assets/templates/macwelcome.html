<style>
    /* Reset Anki's default styles.
       Colors use the dictionary theme's CSS variables (injected via
       customThemeCss) so the welcome screen follows light/dark themes
       instead of staying hardcoded light. */
    *{box-sizing:border-box !important}
    html,body{margin:0 !important;padding:0 !important;overflow-x:hidden !important}
    .welcome-screen{user-select:none !important;margin:0 !important;padding:5px !important;font-family:var(--font-family-base,Arial,sans-serif) !important}
    .keys-container{max-width:1400px;margin:0 auto !important;padding:2px !important}
    .shortcut-section{margin-bottom:6px !important}
    .shortcut-section.global-section{margin-top:clamp(15px,3vh,35px) !important}
    .shortcut-grid{display:grid !important;grid-template-columns:repeat(auto-fit,minmax(300px,1fr)) !important;gap:4px !important;margin-bottom:6px !important}
    @media(min-width:1200px){.shortcut-grid{grid-template-columns:repeat(3,1fr) !important}}
    .shortcut-item{display:flex !important;align-items:center !important;justify-content:space-between !important;margin:2px 0 !important;padding:6px 10px !important;background:var(--background-secondary);border-radius:4px !important;border:1px solid var(--border)}
    .shortcut-keys{display:flex !important;align-items:center !important;gap:3px !important}
    .key__button{box-sizing:border-box !important;line-height:28px !important;font-size:var(--font-size-sm) !important;text-align:center !important;min-width:30px !important;padding:0 6px !important;color:var(--text);margin:0 1px !important;height:28px !important;border:1px solid var(--border) !important;border-radius:4px !important;background:linear-gradient(135deg,var(--background) 0%,var(--background-secondary) 100%) !important;font-family:var(--font-family-mono,monospace) !important;font-weight:500 !important;display:inline-block !important;box-shadow:0 1px 2px rgba(0,0,0,0.1) !important}
    .key__button:hover{background:linear-gradient(135deg,var(--background-secondary) 0%,var(--border) 100%) !important}
    .separator{font-size:var(--font-size-xs) !important;color:var(--text-secondary);margin:0 2px !important;opacity:.75}
    .shortcut-description{font-size:var(--font-size-base) !important;color:var(--text);margin:0 !important;flex:1 !important;text-align:right !important;padding-left:10px !important}
    .section-title{font-size:var(--font-size-xl) !important;font-weight:600 !important;color:var(--header_text);margin:2px 0 4px 0 !important;text-align:center !important}
    .welcome-wrapper{display:flex !important;flex-direction:column !important;min-height:100% !important;padding:5px !important}
    .welcome-footer{margin-top:auto !important;text-align:center !important;padding:10px 15px !important;background:var(--background-secondary);border-radius:6px !important;border:1px solid var(--border)}
</style>
<div class="welcome-wrapper">
    <div class="welcome-screen">
        <h1 align="center" style="margin:0 0 2px 0 !important;font-size:var(--font-size-2xl) !important;color:var(--header_text)">Anki Dictionary Addon</h1>
    </div>
    <div class="keys-container welcome-screen">
        <div class="shortcut-section">
            <h2 class="section-title">Anki Hotkeys</h2>
            <div class="shortcut-grid">
                <div class="shortcut-item">
                    <div class="shortcut-keys">
                        <div class="key__button">⌘</div>
                        <span class="separator">+</span>
                        <div class="key__button">W</div>
                    </div>
                    <p class="shortcut-description">Open/Close dictionary</p>
                </div>
                <div class="shortcut-item">
                    <div class="shortcut-keys">
                        <div class="key__button">⌘</div>
                        <span class="separator">+</span>
                        <div class="key__button">S</div>
                    </div>
                    <p class="shortcut-description">Search in Dictionary</p>
                </div>
                <div class="shortcut-item">
                    <div class="shortcut-keys">
                        <div class="key__button">⌘</div>
                        <span class="separator">+</span>
                        <div class="key__button">Shift</div>
                        <span class="separator">+</span>
                        <div class="key__button">B</div>
                    </div>
                    <p class="shortcut-description">Search in Browser</p>
                </div>
            </div>
        </div>
    </div>
    <div class="welcome-footer">
        <p style="margin:0 0 6px 0 !important;font-size:var(--font-size-base) !important;color:var(--text)">If you find this addon useful, please consider leaving a review or starring the repo!</p>
        <p style="margin:0 !important;font-size:var(--font-size-sm) !important;color:var(--text);opacity:.75">

            &nbsp;&middot;&nbsp;
            <a href="https://ankiweb.net/shared/info/1973740182" style="color:var(--search_term) !important;text-decoration:none !important"><svg style="vertical-align:middle !important;margin-right:4px !important" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 3A1.5 1.5 0 003 4.5v15A1.5 1.5 0 004.5 21h15a1.5 1.5 0 001.5-1.5v-15A1.5 1.5 0 0019.5 3h-15zM7 8.5a1 1 0 011-1h8a1 1 0 110 2H8a1 1 0 01-1-1zm0 4a1 1 0 011-1h8a1 1 0 110 2H8a1 1 0 01-1-1zm0 4a1 1 0 011-1h5a1 1 0 110 2H8a1 1 0 01-1-1z"/></svg>AnkiWeb</a>
        </p>
    </div>
</div>
