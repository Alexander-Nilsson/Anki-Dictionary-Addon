# CI — Runs on PRs and pushes to master.
#
# Trigger strategy:
#   - pull_request → verify PRs before merge
#   - push → catch direct pushes and produce build artifacts
#   - workflow_dispatch → manual runs
#
# Jobs:
#   lint  → ruff + ty (fast feedback)
#   web   → npm ci, Vite build, svelte-check; the built dist/ is shared with
#           the tests so the bundle-sensitive tests actually run
#   test  → unit + integration tests on Linux, Windows and macOS
#   build → package the .ankiaddon and upload it
#
# The release workflow builds its own artifact (the version in the filename
# must match the tag), so the artifact uploaded here is for inspection only.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Ruff Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Type Check (ty)
        run: uv run ty check .

  web:
    name: Web UI Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install JS Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web UI
        working-directory: web
        run: npm run build

      - name: Svelte Check
        working-directory: web
        run: npm run check

      - name: Upload Web Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  test:
    name: Tests (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Qt/X11 Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 \
            libnss3 libnspr4 libfontconfig1 libdbus-1-3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxfixes3 \
            libxrender1 libxi6 libxcursor1 libxxf86vm1 libxss1 \
            libasound2t64 libpulse0 libpulse-mainloop-glib0 \
            xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Download Web Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist
          path: web/dist

      - name: Run Unit Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/ \
            --cov=src/ --cov-report=term-missing --cov-fail-under=0 \
            -p no:qt -p no:xvfb \
            -m "not integration and not network" \
            --ignore=tests/test_all_dictionaries.py \
            --ignore=tests/test_dictionary_index.py \
            --tb=short -v

      - name: Run Integration Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest tests/integration/ \
            -p no:qt -p no:xvfb \
            --ignore=tests/integration/test_smoke_pytest_anki.py \
            --tb=short -v

      # pytest-anki2 boots a full Anki session. QtWebEngine needs a real
      # X display on Linux, and its teardown segfaults during Qt enum cleanup
      # (the test itself passes), so the exit code is ignored on purpose.
      - name: Run pytest-anki2 Smoke Test
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          xvfb-run --auto-servernum \
            uv run pytest tests/integration/test_smoke_pytest_anki.py \
            --tb=short -v

  build:
    name: Build Addon
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Build Addon
        run: uv run python build.py all

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ankiaddon
          path: build/*.ankiaddon
          retention-days: 7
          if-no-files-found: error
