name: Auto Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Create venv with pip seeded
        run: |
          uv venv --seed

      - name: Run CI Suite (Lint + Tests)
        run: |
          xvfb-run -a uv run python dev.py ci

      - name: Determine and Bump Version
        id: versioning
        run: |
          CURRENT_VERSION=$(uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          MAJOR=${ADDR[0]}
          MINOR=${ADDR[1]}
          PATCH=${ADDR[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          TAG="v$NEW_VERSION"
          
          echo "Current Version: $CURRENT_VERSION"
          echo "New Version: $NEW_VERSION"
          
          uv run python -c "
          import re
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          new_content = re.sub(r'version = \"$CURRENT_VERSION\"', 'version = \"$NEW_VERSION\"', content, count=1)
          with open('pyproject.toml', 'w') as f:
              f.write(new_content)
          "
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.versioning.outputs.new_version }} [skip ci]"
          git tag ${{ steps.versioning.outputs.tag }}
          git push origin master --tags

      - name: Build Addon Package
        run: |
          uv run python dev.py build

      - name: Identify Release Asset
        id: assets
        run: |
          ANKIADDON_FILE=$(ls build/*.ankiaddon | head -n 1)
          if [ -z "$ANKIADDON_FILE" ]; then
            echo "❌ No .ankiaddon file found in build directory!"
            exit 1
          fi
          echo "found_asset=$ANKIADDON_FILE" >> $GITHUB_OUTPUT
          echo "Asset found: $ANKIADDON_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          body: |
            ## Anki Dictionary Addon ${{ steps.versioning.outputs.tag }}
            
            This is an automated release triggered by a push to the master branch.
            
            ### 🎯 Installation
            1. Download the `.ankiaddon` file below.
            2. Double-click the file to install it in Anki.
            3. Restart Anki.
            
            ---
            *Automated release generated by GitHub Actions.*
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.found_asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
