[project]
name = "anki-dictionary-addon"
version = "0.1.43"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.9.1",
    "pyqt6-webengine>=6.9.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "beautifulsoup4>=4.12.0",
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
 "anki>=25.9.4",
 "aqt>=25.9.4",
 "ruff>=0.11.0",
 "pytest>=8.4.1",
 "pytest-cov>=6.1.1",
 "pytest-qt>=4.4.0",
 "pytest-xdist>=3.6.1",
 "pytest-xvfb>=3.1.0",
 "pytest-anki2>=2.0.2",
 "ty>=0.0.49",
 "dagger-io>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests that require a real Anki runtime",
    "network: marks tests that make network requests (deselect with '-m \"not network\"')",
]
filterwarnings = []
addopts = "-ra -q"
qt_api = "pyqt6"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["_check_tags.py"]

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"src/anki_dictionary/core/clip_thread.py" = ["B010"]

[tool.ty]

[tool.ty.analysis]
allowed-unresolved-imports = ["PyQt6.*", "anki.*", "aqt.*"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src"]
