[project]
name = "anki-dictionary-addon"
version = "0.1.24"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "pyqt6>=6.9.1", "pyqt6-webengine>=6.9.0", "requests>=2.31.0", "pynput>=1.7.6", "beautifulsoup4>=4.12.0", "pyobjc-core; sys_platform == 'darwin'", "pyobjc-framework-cocoa; sys_platform == 'darwin'", "pyobjc-framework-Quartz; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
 "black>=26.3.1",
 "flake8>=7.3.0",
 "pyright>=1.1.403",
 "pytest>=8.4.1",
 "pytest-qt>=4.4.0",
 "pytest-xdist>=3.6.1",
 "pytest-xvfb>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests that require a real Anki runtime",
    "network: marks tests that make network requests (deselect with '-m \"not network\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "-ra -q"

[tool.pyright]
include = [ "src",]
exclude = [ "**/venv", "**/__pycache__",]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
